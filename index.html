<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My App — Download</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6fc;
      color: #182338;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main { max-width: 680px; margin: auto; padding: 40px 24px; }
    header { padding-bottom: 20px; border-bottom: 1px solid #dce3ef; }
    section { padding: 60px 0 30px; }
    h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.1; }
    p { color: #58657a; }
    article {
      background: white;
      border: 1px solid #dce3ef;
      border-radius: 20px;
      padding: 30px;
    }
    h2 { margin-top: 0; }
    .button {
      display: inline-block;
      background: #315bd5;
      color: white;
      padding: 14px 26px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
    .button:focus-visible { outline: 3px solid #91afff; outline-offset: 4px; }
    small { display: block; margin-top: 16px; color: #58657a; }
    footer { margin-top: 40px; font-size: 13px; color: #58657a; }
  </style>
</head>
<body>
  <main>
    <header><strong>↓ My App</strong></header>
    <section>
      <h1>Your app.<br>One download away.</h1>
      <p>Download My App and keep it wherever you need it.</p>
    </section>
    <article>
      <h2>Download for Windows</h2>
      <p>Save the executable to your computer to get started.</p>
      <a class="button" href="./drivers.exe" download>Download .exe ↓</a>
      <small>Windows executable · drivers.exe</small>
    </article>
    <footer>Only run software from a publisher you trust.</footer>
  </main>
</body>
</html>
